[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-snapshot-lite"
version = "0.1.0"
description = "Snapshot installed Python packages to a CycloneDX 1.5 SBOM. Offline, standard library only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{name = "Alessio Auretto"}]
keywords = [
  "sbom",
  "cyclonedx",
  "software-bill-of-materials",
  "supply-chain",
  "security",
  "python",
  "cli",
  "stdlib",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://py-forge.com/products/sbom-snapshot-installed-environment?utm_source=pypi&utm_medium=pypi&utm_campaign=sbom-snapshot-lite"
Repository = "https://github.com/alessio1999xx-debug/sbom-snapshot-lite"

[project.scripts]
sbom-snapshot-lite = "sbom_snapshot_lite:main"

[tool.setuptools]
py-modules = ["sbom_snapshot_lite"]
