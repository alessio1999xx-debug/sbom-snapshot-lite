name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_sbom_snapshot_lite.py
      - run: python sbom_snapshot_lite.py --self-test
      - run: python sbom_snapshot_lite.py --demo
